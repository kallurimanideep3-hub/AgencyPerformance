<!DOCTYPE html>
<html>
<head>
	<title>Agency Performance - Page 1 Wireframe</title>
	<style>
		body {
			font-family: Arial, sans-serif;
			margin: 20px;
			background: #f5f6f8;
		}

		.header {
			background: #ffffff;
			padding: 20px;
			border: 1px solid #ddd;
			margin-bottom: 15px;
		}

		.filters {
			background: #ffffff;
			padding: 15px;
			border: 1px solid #ddd;
			margin-bottom: 15px;
		}

		.filter {
			display: inline-block;
			border: 1px solid #aaa;
			padding: 10px 30px;
			margin-right: 10px;
		}

		.kpis {
			display: flex;
			gap: 15px;
			margin-bottom: 15px;
		}

		.kpi {
			background: #ffffff;
			border: 1px solid #ddd;
			padding: 25px;
			flex: 1;
			text-align: center;
		}

		.chart {
			background: #ffffff;
			border: 1px solid #ddd;
			padding: 30px;
			height: 250px;
			margin-bottom: 15px;
		}

		.table {
			background: #ffffff;
			border: 1px solid #ddd;
			padding: 30px;
			height: 180px;
		}
	</style>
</head>

<body>

	<div class="header">
		<h1>Agency Performance Dashboard</h1>
		<p>Executive Summary</p>
	</div>

	<div class="filters">
		<strong>Filters:</strong>
		<div class="filter">Region ▼</div>
		<div class="filter">Channel ▼</div>
		<div class="filter">Year ▼</div>
	</div>

	<div class="kpis">
		<div class="kpi">
			<strong>APE YTD</strong>
			<p>$000</p>
		</div>

		<div class="kpi">
			<strong>APE vs Target %</strong>
			<p>00%</p>
		</div>

		<div class="kpi">
			<strong>Active Agents</strong>
			<p>000</p>
		</div>

		<div class="kpi">
			<strong>Persistency Rate</strong>
			<p>00%</p>
		</div>
	</div>

	<div class="chart">
		<h3>Monthly APE vs Target</h3>
		<p>📊 Monthly APE columns + Target line</p>
	</div>

	<div class="table">
		<h3>Top 10 Agents by APE</h3>
		<p>Agent | Region | APE | Target | Achievement %</p>
	</div>

</body>
</html>
